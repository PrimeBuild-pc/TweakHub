name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TweakHub.sln
      - run: dotnet build TweakHub.sln -c Release --no-restore
      - run: dotnet test TweakHub.Tests/TweakHub.Tests.csproj -c Release --no-build --no-restore
