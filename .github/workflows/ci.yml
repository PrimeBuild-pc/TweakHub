name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TweakHub.sln
      - run: dotnet build TweakHub.sln -c Release --no-restore
      - run: dotnet test TweakHub.Tests/TweakHub.Tests.csproj -c Release --no-build --no-restore
      - name: Test Store-specific behavior
        run: dotnet test TweakHub.Tests/TweakHub.Tests.csproj -c Release --no-restore -p:StorePackage=true --filter FullyQualifiedName~StorePackageTests

      - name: Record the tested PR merge commit
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: Set-Content -LiteralPath "${env:RUNNER_TEMP}/tested-merge.txt" -Value $env:GITHUB_SHA
      - name: Upload the tested PR merge commit
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-merge-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-merge.txt
          if-no-files-found: error
          retention-days: 7
