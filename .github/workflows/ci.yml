name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TweakHub.sln
      - run: dotnet build TweakHub.sln -c Release --no-restore
      - run: dotnet test TweakHub.Tests/TweakHub.Tests.csproj -c Release --no-build --no-restore
